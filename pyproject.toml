[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flowlab"
version = "0.1.0"
description = "Reproducible intrusion detection experiments under packet loss"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "numpy>=2,<3",
  "pandas>=2.2,<4", "scikit-learn>=1.6,<2", "xgboost>=3,<4",
  "scapy>=2.6,<3", "joblib>=1.4,<2", "httpx>=0.28,<1",
  "python-multipart>=0.0.20", "shap>=0.48,<1",
]
[project.optional-dependencies]
neural = ["torch>=2.6", "tabm>=0.0.3"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
flowlab = "flowlab.cli:main"

[tool.setuptools.package-data]
flowlab = ["static/*", "static/fonts/*"]
[tool.setuptools.packages.find]
include = ["flowlab*"]
[tool.ruff]
line-length = 110

